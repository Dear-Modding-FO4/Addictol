name: xmake

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: build
    permissions:
      contents: read
    uses: ./.github/workflows/xmake-check.yml
    with:
      source_sha: ${{ github.sha }}
      upload_artifact: true
