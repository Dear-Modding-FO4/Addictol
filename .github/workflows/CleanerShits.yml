name: Cleanup Old Runs
on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly on Sundays
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 14 # Keeps only the last 14 days of runs
          keep_minimum_runs: 6 # Ensures you don't delete everything
      - name: Delete old beta releases
        uses: jay2610/delete-older-releases@1.0.0
        with:
          repo: <owner>/<repoName> # defaults to current repo
          keep_latest: 6
          delete_tag_pattern: beta # defaults to ""
          delete_type: 'release'
          target_branch: 'master'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
