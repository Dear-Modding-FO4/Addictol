name: MSBuild

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  package:
    name: package
    permissions:
      contents: read
    uses: ./.github/workflows/build-package.yml
    with:
      source_sha: ${{ github.sha }}
      kind: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'development' || 'validation' }}
      build_number: ${{ github.run_number }}

  publish-development:
    name: Publish development prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-publication
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation

      - name: Download pinned package
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: release-assets

      - name: Publish prerelease unless product version is stable
        shell: pwsh
        env:
          AUTOMATION_ROOT: ${{ github.workspace }}/automation
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PRODUCT_VERSION: ${{ needs.package.outputs.product_version }}
          BUILD_IDENTITY: ${{ needs.package.outputs.build_identity }}
          SOURCE_SHA: ${{ github.sha }}
          ASSET_PATH: release-assets/${{ needs.package.outputs.asset_name }}
        run: |
          & "$env:AUTOMATION_ROOT/.github/scripts/publish-release.ps1" `
            -Channel development `
            -Repository $env:REPOSITORY `
            -ProductVersion $env:PRODUCT_VERSION `
            -BuildIdentity $env:BUILD_IDENTITY `
            -SourceSha $env:SOURCE_SHA `
            -AssetPath $env:ASSET_PATH
